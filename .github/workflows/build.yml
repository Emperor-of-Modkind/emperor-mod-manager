name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          # CI builds do not need code signing for unsigned artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Package Linux tarball
        if: matrix.platform == 'linux'
        run: node scripts/package-linux-tarball.mjs

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: emperor-mod-manager-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/emperor-mod-manager
            dist-packages/*.tar.gz
            dist-packages/SHA256SUMS
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: emperor-mod-manager-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/emperor-mod-manager.exe
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK & Build-Tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android APK
        run: ./scripts/build-android-apk.sh --all-targets --skip-rustup --no-sign
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: Sign & package Android APK
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/release.keystore /tmp/aligned.apk' EXIT

          mkdir -p dist-android
          VERSION="$(node -p "require('./package.json').version")"
          SRC_APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-unsigned.apk' | sort | head -n 1)"
          if [[ -z "$SRC_APK" ]]; then
            echo "::error::No unsigned release APK produced under src-tauri/gen/android/app/build/outputs/apk" >&2
            exit 1
          fi

          OUT_APK="dist-android/emperor-mod-manager-${VERSION}-universal.apk"
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            missing=()
            [[ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
            [[ -n "${ANDROID_KEY_ALIAS:-}" ]] || missing+=(ANDROID_KEY_ALIAS)
            [[ -n "${ANDROID_KEY_PASSWORD:-}" ]] || missing+=(ANDROID_KEY_PASSWORD)
            if [[ "${#missing[@]}" -gt 0 ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set, but missing required secret(s): ${missing[*]}" >&2
              exit 1
            fi

            BT_DIR=""
            if [[ -d "${ANDROID_HOME}/build-tools/35.0.0" ]]; then
              BT_DIR="${ANDROID_HOME}/build-tools/35.0.0"
            elif [[ -d "${ANDROID_HOME}/build-tools" ]]; then
              latest_bt="$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1 || true)"
              if [[ -n "$latest_bt" ]]; then
                BT_DIR="${ANDROID_HOME}/build-tools/${latest_bt}"
              fi
            fi
            if [[ -z "$BT_DIR" || ! -x "${BT_DIR}/apksigner" || ! -x "${BT_DIR}/zipalign" ]]; then
              echo "::error::Android build-tools (zipalign/apksigner) not found under ${ANDROID_HOME}/build-tools" >&2
              exit 1
            fi

            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/release.keystore
            "${BT_DIR}/zipalign" -p -f 4 "$SRC_APK" /tmp/aligned.apk
            "${BT_DIR}/apksigner" sign \
              --v4-signing-enabled false \
              --ks /tmp/release.keystore \
              --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --key-pass "env:ANDROID_KEY_PASSWORD" \
              --out "$OUT_APK" \
              /tmp/aligned.apk
            "${BT_DIR}/apksigner" verify --verbose --print-certs "$OUT_APK"
          elif [[ "${IS_RELEASE:-false}" == "true" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured. Refusing to publish an unsigned APK on a release build. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Actions Secrets." >&2
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; producing unsigned APK for non-release build."
            cp "$SRC_APK" "dist-android/emperor-mod-manager-${VERSION}-universal-unsigned.apk"
          fi
          (cd dist-android && sha256sum *.apk > SHA256SUMS-android)
        env:
          IS_RELEASE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emperor-mod-manager-android
          path: dist-android/*
          if-no-files-found: warn

  release:
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/v'))
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version="$(node -p "require('./package.json').version")"
            echo "name=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stamp Arch PKGBUILD
        run: |
          node scripts/arch-pkgbuild.mjs artifacts/emperor-mod-manager-linux \
            -o artifacts/arch/PKGBUILD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            artifacts/emperor-mod-manager-linux/**
            artifacts/emperor-mod-manager-windows/**
            artifacts/emperor-mod-manager-android/**
            artifacts/arch/PKGBUILD
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
